<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iTeX — Community Network</title>
<style>
:root{
  --bg:#07070a; --panel:#101017; --panel2:#15151e; --panel3:#1b1b26;
  --line:#242433; --text:#e9e9f2; --muted:#8b8b9e;
  --accent:#e11d2e; --accent2:#ff4155; --gold:#ffc53d; --green:#25c26e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Segoe UI',Tahoma,'Noto Kufi Arabic',sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;height:100dvh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;outline:none}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

.auth-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 20% 15%,rgba(225,29,46,.18),transparent 45%),
    radial-gradient(circle at 80% 85%,rgba(225,29,46,.12),transparent 45%),
    #07070a;
  z-index:500;padding:18px;
}
.auth-card{
  width:100%;max-width:400px;background:linear-gradient(160deg,#14141d,#0d0d13);
  border:1px solid var(--line);border-radius:22px;padding:34px 26px 26px;
  box-shadow:0 30px 80px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.04);
  animation:pop .45s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.brand{
  font-size:40px;font-weight:900;letter-spacing:-1px;text-align:center;
  background:linear-gradient(92deg,#fff 10%,var(--accent2) 60%,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-style:italic;
}
.brand-sub{text-align:center;color:var(--muted);font-size:10px;letter-spacing:5px;margin-top:4px;margin-bottom:26px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{
  width:100%;padding:13px 14px;border-radius:12px;background:#0b0b11;
  border:1px solid var(--line);color:var(--text);font-size:14px;transition:.2s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,46,.14)}
.btn-main{
  width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:15px;
  background:linear-gradient(92deg,var(--accent),#a8121f);color:#fff;margin-top:8px;
  transition:.2s;box-shadow:0 8px 22px rgba(225,29,46,.3);
}
.btn-main:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn-main:active{transform:translateY(0)}
.btn-ghost{
  width:100%;padding:11px;border-radius:12px;font-size:13px;color:var(--muted);
  border:1px solid var(--line);margin-top:10px;transition:.2s;background:#0b0b11;
}
.btn-ghost:hover{color:var(--text);border-color:#3a3a4d}
.auth-msg{text-align:center;font-size:13px;margin-top:12px;min-height:18px;color:var(--accent2)}
.auth-msg.ok{color:var(--green)}
.loading-screen{
  position:fixed;inset:0;background:#07070a;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
.spinner{
  width:52px;height:52px;border:4px solid #1b1b26;border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen p{color:var(--muted);font-size:14px}

.app{display:flex;flex-direction:row-reverse;height:100dvh;width:100%}
.rail{
  width:76px;flex:0 0 76px;background:#0a0a10;border-left:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:12px 0;overflow-y:auto;overflow-x:hidden;
}
.rail::-webkit-scrollbar{width:0}
.srv{
  width:48px;height:48px;border-radius:16px;background:var(--panel3);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  color:var(--muted);transition:.2s;flex:0 0 auto;overflow:hidden;position:relative;
  border:1px solid transparent;
}
.srv img{width:100%;height:100%;object-fit:cover}
.srv:hover{border-radius:14px;background:var(--accent);color:#fff;transform:translateY(-2px)}
.srv.active{border-radius:14px;background:linear-gradient(140deg,var(--accent),#8f0f1b);color:#fff;border-color:rgba(255,255,255,.15)}
.srv.add{background:transparent;border:1.5px dashed #33334a;color:var(--green);font-size:24px}
.srv.add:hover{background:var(--green);color:#04150c;border-style:solid}
.rail-sep{width:32px;height:1px;background:var(--line);flex:0 0 auto}

.channels{
  width:252px;flex:0 0 252px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
.srvHead{
  padding:14px 14px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:8px;min-height:62px;
  background:linear-gradient(180deg,#14141d,#101017);
}
.srvHead .name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srvHead .sub{font-size:10px;color:var(--accent2);letter-spacing:1px;margin-top:2px}
.icon-btn{
  width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:16px;transition:.2s;flex:0 0 auto;
}
.icon-btn:hover{background:#22222f;color:#fff}
.catList{flex:1;overflow-y:auto;padding:10px 8px 4px}
.cat{margin-bottom:14px}
.catName{
  font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;
  padding:0 8px 6px;display:flex;align-items:center;justify-content:space-between;
}
.catName button{font-size:14px;color:var(--muted);padding:0 4px;border-radius:6px}
.catName button:hover{color:var(--green)}
.chan{
  padding:9px 10px;border-radius:9px;font-size:13.5px;color:#a9a9bd;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.15s;margin-bottom:2px;
}
.chan:hover{background:#1a1a25;color:#fff}
.chan.active{background:linear-gradient(90deg,rgba(225,29,46,.22),rgba(225,29,46,.05));color:#fff;font-weight:600}
.chan .lock{font-size:10px;opacity:.6}
.addBtn{
  width:calc(100% - 16px);margin:2px 8px 10px;padding:8px;border-radius:9px;font-size:12px;
  color:var(--muted);border:1px dashed #2e2e42;transition:.2s;
}
.addBtn:hover{color:var(--green);border-color:var(--green)}
.empty{font-size:12px;color:#55556b;padding:8px 10px}

.userBar{
  border-top:1px solid var(--line);padding:9px 10px;display:flex;align-items:center;
  gap:9px;background:#0c0c13;
}
.userBar .info{flex:1;min-width:0}
.userBar .uname{font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userBar .urole{font-size:10px;color:var(--muted)}
.av{border-radius:50%;object-fit:cover;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.avTxt{background:linear-gradient(140deg,#3a3a52,#22222f);text-transform:uppercase}

.chat{flex:1;min-width:0;display:flex;flex-direction:column;background:#0c0c12}
.chatHead{
  height:62px;flex:0 0 62px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:10px;padding:0 14px;background:#101017;
}
.chatHead .title{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.chatHead .title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatHead .sub{font-size:11px;color:var(--muted);font-weight:400}
.adminBtn{
  background:linear-gradient(92deg,var(--accent),#8f0f1b);color:#fff;padding:8px 14px;
  border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;
  box-shadow:0 6px 18px rgba(225,29,46,.3);transition:.2s;
}
.adminBtn:hover{filter:brightness(1.15)}
.messages{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:10px;padding:6px 8px;border-radius:10px;transition:.15s}
.msg:hover{background:rgba(255,255,255,.022)}
.msg .body{min-width:0;flex:1}
.msg .top{display:flex;align-items:center;gap:7px;margin-bottom:2px;flex-wrap:wrap}
.msg .who{font-weight:800;font-size:13.5px}
.msg .time{font-size:10px;color:#5c5c72}
.msg .txt{font-size:14px;line-height:1.55;color:#d6d6e2;word-wrap:break-word;white-space:pre-wrap}
.msg.sys .txt{color:var(--accent2);font-size:12.5px;font-style:italic}
.msg.sys{background:rgba(225,29,46,.05);border-right:2px solid var(--accent)}
.welcome{
  margin:auto;text-align:center;color:var(--muted);padding:30px;
}
.welcome .big{font-size:30px;font-weight:900;color:#fff;margin-bottom:8px;
  background:linear-gradient(92deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.composer{padding:10px 14px 14px;display:flex;gap:8px;align-items:center}
.composer input{
  flex:1;padding:13px 16px;border-radius:14px;background:#15151e;border:1px solid var(--line);
  color:var(--text);font-size:14px;transition:.2s;min-width:0;
}
.composer input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,46,.1)}
.sendBtn{
  width:44px;height:44px;flex:0 0 44px;border-radius:50%;
  background:linear-gradient(140deg,var(--accent),#95101c);color:#fff;font-size:17px;
  display:flex;align-items:center;justify-content:center;transition:.2s;
  box-shadow:0 6px 18px rgba(225,29,46,.3);
}
.sendBtn:hover{transform:scale(1.07)}

.friends{
  width:252px;flex:0 0 252px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
.fHead{padding:16px 14px;font-weight:800;font-size:15px;border-bottom:1px solid var(--line);background:#101017}
.fBody{flex:1;overflow-y:auto;padding:10px}
.fSection{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;margin:14px 6px 6px}
.fSection:first-child{margin-top:4px}
.addFriend{display:flex;gap:6px;padding:0 4px 4px}
.addFriend input{
  flex:1;min-width:0;padding:9px 11px;border-radius:10px;background:#0b0b11;
  border:1px solid var(--line);color:var(--text);font-size:12.5px;
}
.addFriend input:focus{border-color:var(--accent)}
.addFriend button{
  padding:9px 12px;border-radius:10px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;
}
.fRow{
  display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:11px;cursor:pointer;
  transition:.15s;margin-bottom:2px;
}
.fRow:hover{background:#1a1a25}
.fRow.active{background:linear-gradient(90deg,rgba(225,29,46,.22),rgba(225,29,46,.04))}
.fName{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.mini{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:700;transition:.2s}
.mini.ok{background:rgba(37,194,110,.15);color:var(--green)}
.mini.ok:hover{background:var(--green);color:#04150c}
.mini.no{background:rgba(225,29,46,.15);color:var(--accent2)}
.mini.no:hover{background:var(--accent);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 auto}

.overlay{
  position:fixed;inset:0;background:rgba(3,3,6,.78);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;z-index:900;padding:16px;
  animation:fade .18s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:440px;max-height:88dvh;overflow-y:auto;
  background:linear-gradient(165deg,#15151f,#0e0e15);border:1px solid var(--line);
  border-radius:20px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.8);
  animation:pop .28s cubic-bezier(.2,.9,.3,1.25);
}
.modal h3{font-size:17px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal h3 .tag{font-size:10px;background:var(--accent);padding:3px 8px;border-radius:20px;font-weight:700}
.modal .hint{font-size:11.5px;color:var(--muted);margin-top:-8px;margin-bottom:14px;line-height:1.6}
.row{margin-bottom:12px}
.row label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.row input,.row select{
  width:100%;padding:11px 13px;border-radius:11px;background:#0b0b11;
  border:1px solid var(--line);color:var(--text);font-size:13.5px;
}
.row input:focus,.row select:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:9px;margin-top:18px}
.modal-actions button{flex:1;padding:12px;border-radius:11px;font-weight:700;font-size:13.5px;transition:.2s}
.mOk{background:linear-gradient(92deg,var(--accent),#95101c);color:#fff}
.mOk:hover{filter:brightness(1.15)}
.mNo{background:#1b1b26;color:var(--muted);border:1px solid var(--line)}
.mNo:hover{color:#fff}
.chk{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;background:#0b0b11;border:1px solid var(--line);margin-bottom:8px;font-size:13px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.chk:hover{border-color:#33334a}

#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:#1a1a26;border:1px solid var(--line);border-right:3px solid var(--accent);
  padding:11px 18px;border-radius:12px;font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.6);
  animation:pop .25s;max-width:90vw;
}
.toast.ok{border-right-color:var(--green)}

.mobile-only{display:none!important}

@media (max-width:920px){
  .rail{width:64px;flex:0 0 64px;gap:8px}
  .srv{width:44px;height:44px;border-radius:14px;font-size:14px}
  .channels{
    position:fixed;top:0;bottom:0;left:64px;width:min(262px,78vw);z-index:120;
    transform:translateX(-115%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
    box-shadow:14px 0 50px rgba(0,0,0,.75);
  }
  .channels.open{transform:translateX(0)}
  .friends{
    position:fixed;top:0;bottom:0;right:0;width:min(272px,82vw);z-index:120;
    transform:translateX(115%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
    box-shadow:-14px 0 50px rgba(0,0,0,.75);
  }
  .friends.open{transform:translateX(0)}
  .mobile-only{display:flex!important}
  .chatHead{padding:0 10px;gap:7px}
  .chatHead .title{font-size:14px}
  .adminBtn{padding:7px 10px;font-size:11.5px}
  .messages{padding:12px 8px 6px}
  .composer{padding:8px 10px 12px}
}
@media (max-width:400px){
  .brand{font-size:33px}
  .rail{width:58px;flex:0 0 58px}
  .srv{width:40px;height:40px}
  .channels{left:58px}
}
</style>
</head>
<body>

<!-- ============ LOADING ============ -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>جارٍ الاتصال بالخادم السحابي...</p>
</div>

<!-- ============ AUTH ============ -->
<div class="auth-screen hidden" id="authScreen">
  <div class="auth-card">
    <div class="brand">iTeX</div>
    <div class="brand-sub">COMMUNITY NETWORK</div>

    <div class="field"><label>اسم المستخدم</label><input id="loginUser" placeholder="username" autocomplete="off"></div>
    <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" placeholder="••••••••"></div>
    <button class="btn-main" onclick="doLogin()">تسجيل الدخول</button>
    <button class="btn-ghost" onclick="doRegister()">إنشاء حساب جديد</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app hidden" id="appScreen">
  <aside class="rail" id="rail"></aside>
  <aside class="channels" id="channelsPanel"></aside>

  <main class="chat">
    <header class="chatHead">
      <button class="icon-btn mobile-only" onclick="togglePanel('channels')">☰</button>
      <div class="title" id="chatTitle"><span>iTeX</span></div>
      <button class="icon-btn" id="collapseBtn" onclick="toggleCollapse()" title="إخفاء/إظهار الأقسام">⟨⟨</button>
      <button class="adminBtn hidden" id="adminBtn" onclick="openAdminPanel()">لوحة التحكم</button>
      <button class="icon-btn mobile-only" onclick="togglePanel('friends')">👥</button>
    </header>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="msgInput" placeholder="اكتب رسالة أو أمر (/tw ، /mute ، /ban)..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </main>

  <aside class="friends" id="friendsPanel"></aside>
</div>

<div id="toasts"></div>

<!-- ============ FIREBASE SDK (Compat) ============ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>

<script>
/* =====================================================================
   Firebase Init
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDJdlo9mSdINt3A4KLvpBdxXjK28LdrWB0",
  authDomain: "policerp-a71c8.firebaseapp.com",
  projectId: "policerp-a71c8",
  storageBucket: "policerp-a71c8.firebasestorage.app",
  messagingSenderId: "569720054342",
  appId: "1:569720054342:web:858b7f239f5c35929ca047",
  measurementId: "G-TVEYLTLBBC",
  databaseURL: "https://policerp-a71c8-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
try { firebase.analytics(); } catch(e) {}
const db = firebase.database();

/* =====================================================================
   State & Config
   ===================================================================== */
const OWNER_USER = 'i7';
const OWNER_PASS = 'i7227711';
const ROOT = 'itex';

const $  = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();

let DB = { users:{}, servers:{}, dms:{}, session:null };
let ME = null;
let state = { serverId:null, channelId:null, dmId:null, view:'server', readOnly:false, collapsed:false };

/* =====================================================================
   Firebase Realtime Sync
   ===================================================================== */
function fbRef(path){ return db.ref(ROOT + '/' + path); }

function watchFirebase(){
  // المستخدمون
  fbRef('users').on('value', snap => {
    DB.users = snap.val() || {};
    if(ME) {
      const fresh = DB.users[ME.id];
      if(fresh) ME = fresh;
      // إذا حُظر المستخدم الحالي — يخرج
      if(ME && ME.banned){
        toast('تم حظرك من الموقع');
        setTimeout(() => logout(), 1200);
        return;
      }
    }
    renderAll();
  });

  // الخوادم
  fbRef('servers').on('value', snap => {
    DB.servers = snap.val() || {};
    // ضمان وجود الخادم الأساسي وحق الأونر
    ensureBaseServers();
    renderAll();
  });

  // المحادثات الخاصة
  fbRef('dms').on('value', snap => {
    DB.dms = snap.val() || {};
    renderAll();
  });
}

function saveUsers(){ fbRef('users').set(DB.users); }
function saveServers(){ fbRef('servers').set(DB.servers); }
function saveDMs(){ fbRef('dms').set(DB.dms); }

function saveAll(){ saveUsers(); saveServers(); saveDMs(); }

/* =====================================================================
   Base Servers (iTeX العام + خادم الأونر)
   ===================================================================== */
function ensureBaseServers(){
  let changed = false;
  if(!DB.users) DB.users = {};
  if(!DB.servers) DB.servers = {};

  // حساب الأونر
  let owner = Object.values(DB.users).find(u => u.username === OWNER_USER);
  if(!owner){
    owner = {
      id:'u_owner', username:OWNER_USER, password:OWNER_PASS, display:'i7', avatar:'',
      isOwner:true, star:true, banned:false, mute:false, timeout:0,
      friends:[], incoming:[], outgoing:[]
    };
    DB.users[owner.id] = owner;
    changed = true;
  } else {
    owner.isOwner = true; owner.star = true; owner.banned = false;
  }

  // الخادم الأساسي
  if(!DB.servers['s_main']){
    DB.servers['s_main'] = {
      id:'s_main', name:'iTeX العام', icon:'', ownerId:'u_owner',

        ]},

          { id:'ch_gen', name:'الشات العام', adminOnly:false, roles:[], messages:[] }
        ]},
        { id:'cat_c', name:'خاص بالإدارة', channels:[

  // خادم الأونر الخاص
  if(!DB.servers['s_owner']){
    DB.servers['s_owner'] = {

          ]}

/* =====================================================================
   Helpers
   ===================================================================== */
function userById(id){ return DB.users ? DB.users[id] : null; }
function serverById(id){ return DB.servers ? DB.servers[id] : null; }
function currentServer(){ return serverById(state.serverId); }
function currentChannel(){
  const s = currentServer(); if(!s || !s.categories) return null;
  for(const c of s.categories) for(const ch of (c.channels||[])) if(ch.id === state.channelId) return ch;
  return null;
}
function isServerAdmin(s, u){
  if(!s || !u) return false;
  if(u.isOwner) return true;
  if(s.ownerId === u.id) return true;
  if((s.adminIds||[]).includes(u.id)) return true;
  return false;
}
function userRoles(s, u){
  if(!s || !u) return [];
  return (s.roles||[]).filter(r => (r.members||[]).includes(u.id)).map(r => r.id);
}
function canSeeChannel(s, ch, u){
  if(!u) return false;
  if(isServerAdmin(s, u)) return true;
  if(ch.adminOnly) return false;
  if(ch.roles && ch.roles.length){
    const mine = userRoles(s, u);
    return ch.roles.some(r => mine.includes(r));
  }
  return true;
}
function canSeeServer(s, u){
  if(!u) return false;
  if(u.isOwner) return true;
  if((s.blocked||[]).includes(u.id)) return false;
  if(s.isPrivate && !(s.members||[]).includes(u.id)) return false;
  return true;
}
function avatarHTML(u, size = 34){
  if(!u) return `<div class="av avTxt" style="width:${size}px;height:${size}px;font-size:${size*0.4}px">?</div>`;
  if(u.avatar) return `<img class="av" style="width:${size}px;height:${size}px" src="${u.avatar}" alt="">`;
  return `<div class="av avTxt" style="width:${size}px;height:${size}px;font-size:${size*0.4}px">${esc((u.display||u.username||'?').slice(0,2))}</div>`;
}
function fmtTime(ts){ return new Date(ts).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' }); }
function toast(msg, ok){
  const t = document.createElement('div');
  t.className = 'toast' + (ok ? ' ok' : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.3s'; setTimeout(() => t.remove(), 320); }, 2400);
}
function openModal(html){
  const w = document.createElement('div');
  w.className = 'overlay';
  w.innerHTML = `<div class="modal">${html}</div>`;
  w.addEventListener('mousedown', e => { if(e.target === w) w.remove(); });
  document.body.appendChild(w);
  return w;
}
function closeModal(){ const all = document.querySelectorAll('.overlay'); if(all.length) all[all.length-1].remove(); }
function isMuted(u){ return u.mute || (u.timeout && u.timeout > now()); }

/* =====================================================================
   Auth
   ===================================================================== */
function doLogin(){
  const un = $('#loginUser').value.trim();
  const pw = $('#loginPass').value;
  const msg = $('#authMsg');
  if(!un || !pw){ msg.className = 'auth-msg'; msg.textContent = 'أدخل اسم المستخدم وكلمة المرور'; return; }
  const u = Object.values(DB.users || {}).find(x => x.username.toLowerCase() === un.toLowerCase());
  if(!u || u.password !== pw){ msg.className = 'auth-msg'; msg.textContent = 'بيانات الدخول غير صحيحة'; return; }
  if(u.banned){ msg.className = 'auth-msg'; msg.textContent = 'هذا الحساب محظور من الموقع'; return; }
  DB.session = u.id;
  try { localStorage.setItem('itex_session', u.id); } catch(e){}
  enterApp(u);
}

function doRegister(){
  openModal(`
    <h3>إنشاء حساب جديد</h3>
    <div class="row"><label>اسم المستخدم (بالإنجليزي)</label><input id="regU" placeholder="username"></div>
    <div class="row"><label>الاسم الظاهر</label><input id="regD" placeholder="الاسم الذي يظهر للآخرين"></div>
    <div class="row"><label>كلمة المرور</label><input id="regP" type="password" placeholder="••••••••"></div>
    <div class="modal-actions">
      <button class="mOk" onclick="submitRegister()">إنشاء</button>
      <button class="mNo" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

function submitRegister(){
  const un = $('#regU').value.trim();
  const dn = $('#regD').value.trim() || un;
  const pw = $('#regP').value;
  if(!/^[A-Za-z0-9_.]{3,16}$/.test(un)){ toast('اسم المستخدم: 3-16 حرف إنجليزي/رقم'); return; }
  if(pw.length < 4){ toast('كلمة المرور قصيرة جدًا'); return; }
  if(Object.values(DB.users||{}).some(u => u.username.toLowerCase() === un.toLowerCase())){ toast('اسم المستخدم مستخدم بالفعل'); return; }
  const u = { id:uid(), username:un, password:pw, display:dn, avatar:'',
              isOwner:false, star:false, banned:false, mute:false, timeout:0,
              friends:[], incoming:[], outgoing:[] };
  DB.users[u.id] = u;
  saveUsers();
  logAction(null, `تم إنشاء حساب جديد: ${u.username}`, null);
  closeModal();
  toast('تم إنشاء الحساب ✔ يمكنك الدخول الآن', true);
}

function logout(){
  try { localStorage.removeItem('itex_session'); } catch(e){}
  ME = null;
  $('#appScreen').classList.add('hidden');
  $('#authScreen').classList.remove('hidden');
  $('#loginPass').value = '';
}

function enterApp(u){
  ME = u;
  $('#authScreen').classList.add('hidden');
  $('#appScreen').classList.remove('hidden');
  $('#adminBtn').classList.toggle('hidden', !ME.isOwner);

  const vis = Object.values(DB.servers||{}).filter(s => canSeeServer(s, ME));
  if(!vis.find(s => s.id === state.serverId)){
    state.serverId = vis.length ? vis[0].id : null;
    state.channelId = null;
    state.view = 'server';
  }
  if(state.serverId) pickFirstChannel(state.serverId);
  renderAll();
}

/* =====================================================================
   Logging
   ===================================================================== */
function logAction(actor, text, target){
  const line = `[${new Date().toLocaleString('ar-EG')}] ${actor ? '@'+actor.username : 'النظام'} — ${text}`;
  const s = DB.servers['s_owner'];
  if(!s || !s.categories) return;
  const ch = s.categories.flatMap(c => c.channels).find(c => c.id === 'och_logs');
  if(!ch) return;
  if(!ch.messages) ch.messages = [];
  ch.messages.push({ id:uid(), uid:'u_owner', text:line, ts:now(), sys:true });
  if(ch.messages.length > 300) ch.messages.splice(0, ch.messages.length - 300);
  saveServers();
}

function renderAll(){

  renderRail();

function renderRail(){

function renderChannels(){
  const p = $('#channelsPanel');
  const s = currentServer();

  let h = `
    <div class="srvHead">
      <div style="min-width:0">
        <div class="name">${esc(s.name)}</div>
        <div class="sub">${admin ? 'ADMINISTRATOR' : 'MEMBER'}</div>
      </div>
      ${admin ? `<button class="icon-btn" onclick="openServerSettings()" title="إعدادات الخادم">⚙</button>` : ''}
    </div>
    <div class="catList">`;

  (s.categories||[]).forEach(cat => {
    const chans = (cat.channels||[]).filter(ch => canSeeChannel(s, ch, ME));
    if(!chans.length && !admin) return;
    h += `<div class="cat"><div class="catName"><span>${esc(cat.name)}</span>${
      admin ? `<button onclick="addChannel('${cat.id}')" title="إضافة روم">+</button>` : ''
    }</div>`;
    chans.forEach(ch => {
      const active = state.view === 'server' && state.channelId === ch.id;
      h += `<div class="chan ${active ? 'active' : ''}" onclick="openChannel('${ch.id}')">
              <span>#</span><span>${esc(ch.name)}</span>${ch.adminOnly ? '<span class="lock">🔒</span>' : ''}
            </div>`;
    });
    if(!chans.length && admin) h += `<div class="empty">لا توجد رومات</div>`;
    h += `</div>`;
  });

  if(admin) h += `<button class="addBtn" onclick="addCategory()">+ إضافة كاتجوري</button>`;
  h += `</div>`;
  h += userBarHTML();
  p.innerHTML = h;
}

function userBarHTML(){
  const role = ME.isOwner ? 'OWNER' : 'MEMBER';
  return `
    <div class="userBar">
      ${avatarHTML(ME, 36)}

        <div class="uname">${esc(ME.display)} ${ME.star ? '⭐' : ''}</div>

}

function renderChat(){
  const box = $('#messages');
  const title = $('#chatTitle');
  const input = $('#msgInput');
  box.innerHTML = '';

  if(state.view === 'dm'){
    const dm = DB.dms[state.dmId];
    if(!dm){ box.innerHTML = `<div class="welcome"><div class="big">iTeX</div><div>اختر محادثة</div></div>`; title.innerHTML = '<span>الرسائل الخاصة</span>'; return; }
    const otherId = (dm.users||[]).find(i => i !== ME.id);
    const other = userById(otherId) || ME;
    title.innerHTML = `<span>💬 ${esc(other.display)} ${other.star ? '⭐' : ''}</span>
      <span class="sub">${state.readOnly ? 'عرض فقط (أونر)' : 'محادثة خاصة'}</span>`;
    if(!(dm.messages||[]).length){
      box.innerHTML = `<div class="welcome"><div class="big">بداية المحادثة</div><div>أرسل أول رسالة إلى ${esc(other.display)}</div></div>`;
    } else {
      dm.messages.forEach(m => box.appendChild(msgEl(m)));
    }
    input.disabled = !!state.readOnly;
    input.placeholder = state.readOnly ? 'لا يمكنك الكتابة في محادثة الآخرين' : 'اكتب رسالة خاصة...';
    box.scrollTop = box.scrollHeight;
    return;
  }

  const s = currentServer();
  const ch = currentChannel();
  if(!s || !ch){
    title.innerHTML = '<span>iTeX</span>';
    box.innerHTML = `<div class="welcome"><div class="big">iTeX Community</div><div>اختر خادمًا ورومًا للبدء</div></div>`;
    input.disabled = true; input.placeholder = '...';
    return;
  }
  title.innerHTML = `<span># ${esc(ch.name)}</span><span class="sub">${esc(s.name)}</span>`;
  input.disabled = false;
  input.placeholder = 'اكتب رسالة أو أمر (/tw ، /mute ، /ban)...';

  if(!(ch.messages||[]).length){
    box.innerHTML = `<div class="welcome"><div class="big"># ${esc(ch.name)}</div><div>لا توجد رسائل بعد — كن أول من يكتب!</div></div>`;
  } else {
    ch.messages.forEach(m => box.appendChild(msgEl(m)));
  }
  box.scrollTop = box.scrollHeight;
}

function msgEl(m){
  const u = userById(m.uid);
  const d = document.createElement('div');
  d.className = 'msg' + (m.sys ? ' sys' : '');
  if(m.sys){
    d.innerHTML = `<div class="body"><div class="txt">${esc(m.text)}</div></div>`;
    return d;
  }
  d.innerHTML = `
    ${avatarHTML(u, 38)}
    <div class="body">
      <div class="top">
        <span class="who" style="color:${u && u.isOwner ? 'var(--accent2)' : '#fff'}">${esc(u ? u.display : 'مجهول')}</span>
        ${u && u.star ? '<span title="موثّق">⭐</span>' : ''}
        ${u && u.isOwner ? '<span style="font-size:9px;background:var(--accent);padding:2px 7px;border-radius:20px;font-weight:700">OWNER</span>' : ''}
        <span class="time">${fmtTime(m.ts)}</span>
      </div>
      <div class="txt">${esc(m.text)}</div>
    </div>`;

}

    h += `<div class="fRow ${active ? 'active' : ''}" onclick="openDMWith('${u.id}')">
            ${avatarHTML(u, 30)}
            <div class="fName">${esc(u.display)} ${u.star ? '⭐' : ''}</div>
            <span class="dot"></span>
          </div>`;
  });

  if(ME.isOwner){
    h += `<div class="fSection">🛡️ كل الأعضاء (${Object.keys(DB.users).length})</div>`;
    Object.values(DB.users).forEach(u => {
      h += `<div class="fRow" onclick="openUserInfo('${u.id}')">
              ${avatarHTML(u, 30)}
              <div class="fName">${esc(u.display)} ${u.star ? '⭐' : ''}</div>
              <span style="font-size:9px;color:var(--muted)">${u.isOwner ? 'OWNER' : (u.banned ? 'محظور' : (isMuted(u) ? 'مكتوم' : ''))}</span>

    });

  }

  h += `</div>`;
  p.innerHTML = h;

/* =====================================================================
   Navigation
   ===================================================================== */
function pickFirstChannel(sid){
  const s = serverById(sid); if(!s || !s.categories) return;
  for(const c of s.categories){
    const ch = (c.channels||[]).find(x => canSeeChannel(s, x, ME));
    if(ch){ state.channelId = ch.id; return; }
  }
  state.channelId = null;
}
function openServer(id){
  state.view = 'server'; state.dmId = null; state.readOnly = false;
  state.serverId = id;
  pickFirstChannel(id);
  renderAll();
}
function openChannel(id){
  state.view = 'server'; state.dmId = null; state.readOnly = false;
  state.channelId = id;
  renderAll(); closePanels();
}
function findDM(a, b){
  return Object.values(DB.dms||{}).find(d => d.users.includes(a) && d.users.includes(b));
}
function openDMWith(userId){
  let dm = findDM(ME.id, userId);
  if(!dm){
    dm = { id:uid(), users:[ME.id, userId], messages:[] };
    DB.dms[dm.id] = dm; saveDMs();
  }
  state.view = 'dm'; state.dmId = dm.id; state.readOnly = false;
  renderAll(); closePanels();
}
function openDMOwner(dmId){
  state.view = 'dm'; state.dmId = dmId;
  const dm = DB.dms[dmId];
  state.readOnly = !(dm && dm.users.includes(ME.id));
  renderAll(); closePanels();
}
function openUserInfo(userId){
  const u = userById(userId); if(!u) return;
  openModal(`
    <h3>معلومات العضو ${u.star ? '⭐' : ''}</h3>
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">
      ${avatarHTML(u, 60)}
      <div>
        <div style="font-weight:800;font-size:17px">${esc(u.display)}</div>
        <div style="color:var(--muted);font-size:12px">@${esc(u.username)}</div>
        <div style="font-size:11px;margin-top:5px;color:var(--accent2)">
          ${u.isOwner ? 'OWNER' : ''}${u.banned ? ' • محظور' : ''}${isMuted(u) ? ' • مكتوم' : ''}
        </div>
      </div>
    </div>
    <div class="modal-actions"><button class="mNo" onclick="closeModal()">إغلاق</button></div>
  `);
}

function togglePanel(which){
  const el = which === 'channels' ? $('#channelsPanel') : $('#friendsPanel');
  const other = which === 'channels' ? $('#friendsPanel') : $('#channelsPanel');

  el.classList.toggle('open');

  $('#channelsPanel').classList.remove('open');

function toggleCollapse(){

/* =====================================================================
   Messaging
   ===================================================================== */
function sendMessage(){
  const input = $('#msgInput');
  const text = input.value.trim();
  if(!text) return;
  if(ME.banned){ toast('أنت محظور من الموقع'); return; }
  if(ME.timeout && ME.timeout > now()){
    const m = Math.ceil((ME.timeout - now()) / 60000);
    toast(`أنت في تايم أوت — متبقٍ ${m} دقيقة`); return;
  }
  if(ME.mute){ toast('أنت مكتوم ولا تستطيع الكتابة'); return; }

  if(text.startsWith('/')){
    if(handleCommand(text)){ input.value = ''; return; }
  }

  if(state.view === 'dm'){
    const dm = DB.dms[state.dmId];
    if(!dm || state.readOnly) return;
    if(!dm.messages) dm.messages = [];
    dm.messages.push({ id:uid(), uid:ME.id, text, ts:now() });
    if(dm.messages.length > 500) dm.messages.splice(0, dm.messages.length - 500);
    saveDMs();
  } else {
    const ch = currentChannel();
    if(!ch) return;
    if(!ch.messages) ch.messages = [];
    ch.messages.push({ id:uid(), uid:ME.id, text, ts:now() });
    if(ch.messages.length > 500) ch.messages.splice(0, ch.messages.length - 500);
    saveServers();
  }
  input.value = '';
  renderChat();
}

function handleCommand(text){
  const parts = text.slice(1).split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const s = currentServer();
  const isAdmin = s && isServerAdmin(s, ME);
  if(!['ban','mute','tw','timeout','unban','unmute'].includes(cmd)) return false;
  if(!isAdmin){ toast('هذا الأمر للإدارة فقط'); return true; }

  const targetName = parts[1];
  const target = Object.values(DB.users).find(u => u.username.toLowerCase() === (targetName||'').toLowerCase());
  if(!target){ toast('لم يتم العثور على العضو'); return true; }
  if(target.isOwner){ toast('لا يمكن تنفيذ الأمر على الأونر'); return true; }

  if(cmd === 'ban'){ target.banned = true; logAction(ME, `حظر العضو @${target.username}`, target); toast('تم حظر العضو', true); }
  if(cmd === 'unban'){ target.banned = false; logAction(ME, `فك الحظر عن @${target.username}`, target); toast('تم فك الحظر', true); }
  if(cmd === 'mute'){ target.mute = true; logAction(ME, `كتم العضو @${target.username}`, target); toast('تم الكتم', true); }
  if(cmd === 'unmute'){ target.mute = false; logAction(ME, `فك الكتم عن @${target.username}`, target); toast('تم فك الكتم', true); }
  if(cmd === 'tw' || cmd === 'timeout'){
    const mins = parseInt(parts[2]) || 10;
    target.timeout = now() + mins * 60000;
    logAction(ME, `تايم أوت ${mins} دقيقة للعضو @${target.username}`, target);
    toast(`تم إعطاء تايم أوت ${mins} دقيقة`, true);
  }
  saveUsers();
  renderAll();
  return true;
}

/* =====================================================================
   Friends
   ===================================================================== */
function sendFriendRequest(){
  const inp = $('#friendInput'); if(!inp) return;
  const name = inp.value.trim();
  if(!name) return;
  const u = Object.values(DB.users).find(x => x.username.toLowerCase() === name.toLowerCase());
  if(!u){ toast('لا يوجد عضو بهذا الاسم'); return; }
  if(u.id === ME.id){ toast('لا يمكنك إضافة نفسك'); return; }
  if((ME.friends||[]).includes(u.id)){ toast('هذا العضو صديقك بالفعل'); return; }
  if((ME.outgoing||[]).includes(u.id)){ toast('الطلب مرسل مسبقًا'); return; }
  ME.outgoing = ME.outgoing || []; u.incoming = u.incoming || [];
  ME.outgoing.push(u.id);
  u.incoming.push(ME.id);
  DB.users[ME.id] = ME; DB.users[u.id] = u;
  logAction(ME, `أرسل طلب صداقة إلى @${u.username}`, u);
  saveUsers(); inp.value = ''; renderFriends();
  toast('تم إرسال طلب الصداقة ✔', true);
}
function acceptRequest(userId){
  const u = userById(userId); if(!u) return;
  ME.incoming = (ME.incoming||[]).filter(i => i !== userId);
  u.outgoing = (u.outgoing||[]).filter(i => i !== ME.id);
  ME.friends = ME.friends || []; u.friends = u.friends || [];
  if(!ME.friends.includes(userId)) ME.friends.push(userId);
  if(!u.friends.includes(ME.id)) u.friends.push(ME.id);
  if(!findDM(ME.id, userId)){
    const dm = { id:uid(), users:[ME.id, userId], messages:[] };
    DB.dms[dm.id] = dm;
  }
  DB.users[ME.id] = ME; DB.users[u.id] = u;
  logAction(ME, `قبل طلب الصداقة من @${u.username}`, u);
  saveAll(); renderAll();
  toast('تمت الإضافة ✔ يمكنكما التحدث الآن', true);
}
function rejectRequest(userId){
  const u = userById(userId); if(!u) return;
  ME.incoming = (ME.incoming||[]).filter(i => i !== userId);
  u.outgoing = (u.outgoing||[]).filter(i => i !== ME.id);
  DB.users[ME.id] = ME; DB.users[u.id] = u;
  saveUsers(); renderFriends();
  toast('تم رفض الطلب');
}

/* =====================================================================
   Server creation
   ===================================================================== */
function openCreateServer(){
  openModal(`
    <h3>إنشاء خادم جديد <span class="tag">+</span></h3>
    <div class="hint">اختر اسمًا وصورة للخادم. ستحصل على كامل الصلاحيات داخل خادمك.</div>
    <div class="row"><label>اسم الخادم</label><input id="newSrvName" placeholder="مثال: خادم الأصدقاء"></div>
    <div class="row"><label>صورة الخادم (من الألبوم)</label><input id="newSrvIcon" type="file" accept="image/*"></div>
    <div class="modal-actions">
      <button class="mOk" onclick="createServer()">إنشاء الخادم</button>
      <button class="mNo" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

function createServer(){
  const name = $('#newSrvName').value.trim();
  const file = $('#newSrvIcon').files[0];
  if(!name){ toast('اكتب اسم الخادم'); return; }

  const finish = icon => {
    const id = uid();
    const s = {
      id, name, icon: icon || '', ownerId: ME.id,
      isPrivate:false, members:[ME.id], adminIds:[], blocked:[], roles:[],
      categories:[
        { id:uid(), name:'الدرجة العامة', channels:[
          { id:uid(), name:'الشات العام', adminOnly:false, roles:[], messages:[] }
        ]}
      ]
    };
    DB.servers[id] = s;
    logAction(ME, `أنشأ خادمًا جديدًا: ${name}`, null);
    saveServers(); closeModal();
    state.view = 'server'; state.serverId = id; state.channelId = s.categories[0].channels[0].id;
    renderAll();
    toast('تم إنشاء الخادم ✔', true);
  };

  if(file){
    const r = new FileReader();
    r.onload = e => finish(e.target.result);
    r.readAsDataURL(file);
  } else finish('');
}

/* =====================================================================
   Server settings
   ===================================================================== */
function openServerSettings(){
  const s = currentServer(); if(!s) return;
  const admin = isServerAdmin(s, ME);
  if(!admin) return;

  openModal(`
    <h3>إعدادات الخادم <span class="tag">${esc(s.name)}</span></h3>
    <div class="row"><label>اسم الخادم</label><input id="ssName" value="${esc(s.name)}"></div>
    <div class="row"><label>صورة الخادم</label><input id="ssIcon" type="file" accept="image/*"></div>

    <label class="chk"><input type="checkbox" id="ssPrivate" ${s.isPrivate?'checked':''}> خادم خاص (لا يراه إلا الأعضاء المضافون)</label>

    <div class="row" style="margin-top:14px">
      <label>إضافة عضو للخادم (يوزر)</label>
      <input id="ssMember" placeholder="username">
    </div>
    <div class="row">
      <label>حجب الخادم عن عضو — Admin Straight (يوزر)</label>
      <input id="ssBlock" placeholder="username">
    </div>

    <div class="modal-actions">
      <button class="mOk" onclick="saveServerSettings()">حفظ التغييرات</button>
      <button class="mNo" onclick="closeModal()">إغلاق</button>
    </div>
  `);
}

function saveServerSettings(){
  const s = currentServer(); if(!s) return;
  const name = $('#ssName').value.trim();
  if(name) s.name = name;
  s.isPrivate = $('#ssPrivate').checked;

  const memName = $('#ssMember').value.trim();
  if(memName){
    const u = Object.values(DB.users).find(x => x.username.toLowerCase() === memName.toLowerCase());
    if(u && !(s.members||[]).includes(u.id)){
      s.members = s.members || []; s.members.push(u.id);
      logAction(ME, `أضاف @${u.username} إلى خادم ${s.name}`, u);
      toast('تمت إضافة العضو ✔', true);
    } else if(!u) toast('العضو غير موجود');
  }
  const blockName = $('#ssBlock').value.trim();
  if(blockName){
    const u = Object.values(DB.users).find(x => x.username.toLowerCase() === blockName.toLowerCase());
    if(u && !u.isOwner){
      s.blocked = s.blocked || [];
      if(!s.blocked.includes(u.id)) s.blocked.push(u.id);
      logAction(ME, `حجب خادم ${s.name} عن @${u.username}`, u);
      toast('تم حجب الخادم عن العضو ✔', true);
    } else if(u && u.isOwner) toast('لا يمكن حجب الأونر');
    else toast('العضو غير موجود');
  }

  const file = $('#ssIcon').files[0];
  if(file){
    const r = new FileReader();
    r.onload = e => { s.icon = e.target.result; DB.servers[s.id] = s; saveServers(); closeModal(); renderAll(); };
    r.readAsDataURL(file);
  } else { DB.servers[s.id] = s; saveServers(); closeModal(); renderAll(); }
}

function addCategory(){
  const s = currentServer(); if(!s || !isServerAdmin(s, ME)) return;
  openModal(`
    <h3>إضافة كاتجوري</h3>
    <div class="row"><label>اسم الكاتجوري</label><input id="newCatName" placeholder="مثال: رومات عامة"></div>
    <div class="modal-actions">
      <button class="mOk" onclick="createCategory()">إضافة</button>
      <button class="mNo" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}
function createCategory(){
  const s = currentServer();
  const name = $('#newCatName').value.trim();
  if(!name){ toast('اكتب اسم الكاتجوري'); return; }
  s.categories.push({ id:uid(), name, channels:[] });
  logAction(ME, `أنشأ كاتجوري "${name}" في خادم ${s.name}`, null);
  DB.servers[s.id] = s; saveServers(); closeModal(); renderAll();
  toast('تمت إضافة الكاتجوري ✔', true);
}

function addChannel(catId){
  const s = currentServer(); if(!s || !isServerAdmin(s, ME)) return;
  const roles = s.roles || [];
  openModal(`
    <h3>إضافة روم جديد</h3>
    <div class="row"><label>اسم الروم</label><input id="newChName" placeholder="مثال: الشات العام"></div>
    <label class="chk"><input type="checkbox" id="newChAdmin"> روم للإدارة فقط 🔒</label>
    <div class="row" style="margin-top:12px">
      <label>الصلاحيات — من يمكنه رؤية الروم؟ (اتركه فارغًا للجميع)</label>
      ${roles.length ? roles.map(r => `
        <label class="chk"><input type="checkbox" class="roleChk" value="${r.id}"> ${esc(r.name)}</label>
      `).join('') : '<div class="empty">لا توجد رتب — أنشئ رتبًا من إعدادات الخادم</div>'}
    </div>
    <div class="modal-actions">
      <button class="mOk" onclick="createChannel('${catId}')">إضافة</button>
      <button class="mNo" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}
function createChannel(catId){
  const s = currentServer();
  const cat = s.categories.find(c => c.id === catId); if(!cat) return;
  const name = $('#newChName').value.trim();
  if(!name){ toast('اكتب اسم الروم'); return; }
  const adminOnly = $('#newChAdmin').checked;
  const roles = [...document.querySelectorAll('.roleChk:checked')].map(i => i.value);
  const ch = { id:uid(), name, adminOnly, roles, messages:[] };
  cat.channels.push(ch);
  logAction(ME, `أنشأ روم "${name}" في خادم ${s.name}`, null);
  DB.servers[s.id] = s; saveServers(); closeModal();
  state.view = 'server'; state.channelId = ch.id;
  renderAll();
  toast('تم إنشاء الروم ✔', true);
}

/* =====================================================================
   Profile
   ===================================================================== */
function openProfileEditor(){
  openModal(`
    <h3>تعديل الحساب</h3>
    <div class="hint">اختر ما تريد تغييره ثم اضغط Done.</div>
    <div class="row"><label>الاسم الظاهر</label><input id="pfDisplay" value="${esc(ME.display)}"></div>
    <div class="row"><label>اسم المستخدم</label><input id="pfUser" value="${esc(ME.username)}"></div>
    <div class="row"><label>كلمة المرور الجديدة (اتركها فارغة لعدم التغيير)</label><input id="pfPass" type="password" placeholder="••••••••"></div>
    <div class="row"><label>الصورة الشخصية (من الألبوم)</label><input id="pfAvatar" type="file" accept="image/*"></div>
    <div class="modal-actions">
      <button class="mOk" onclick="saveProfile()">Done ✓</button>
      <button class="mNo" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}
function saveProfile(){
  const d = $('#pfDisplay').value.trim();
  const un = $('#pfUser').value.trim();
  const pw = $('#pfPass').value;
  const file = $('#pfAvatar').files[0];

  if(d) ME.display = d;
  if(un && un.toLowerCase() !== ME.username.toLowerCase()){
    if(!/^[A-Za-z0-9_.]{3,16}$/.test(un)){ toast('اسم المستخدم غير صالح'); return; }
    if(Object.values(DB.users).some(u => u.id !== ME.id && u.username.toLowerCase() === un.toLowerCase())){ toast('الاسم مستخدم بالفعل'); return; }
    ME.username = un;
  }
  if(pw){
    if(pw.length < 4){ toast('كلمة المرور قصيرة'); return; }
    ME.password = pw;
  }
  const finish = () => { DB.users[ME.id] = ME; saveUsers(); closeModal(); renderAll(); toast('تم تحديث الحساب ✔', true); };
  if(file){
    const r = new FileReader();
    r.onload = e => { ME.avatar = e.target.result; finish(); };
    r.readAsDataURL(file);
  } else finish();
}

/* =====================================================================
   Owner Admin Panel
   ===================================================================== */
function openAdminPanel(){
  if(!ME.isOwner) return;
  openModal(`
    <h3>لوحة تحكم الأونر <span class="tag">OWNER</span></h3>
    <div class="hint">تحكم كامل بالموقع: الحظر، الكتم، التايم أوت، حذف الخوادم، والتوثيق ⭐</div>

    <div class="row"><label>اسم المستخدم للعضو المستهدف</label><input id="adUser" placeholder="username"></div>

    <div class="row">
      <label>الإجراء</label>
      <select id="adAction">
        <option value="ban">حظر من الموقع (Ban)</option>
        <option value="unban">فك الحظر (Unban)</option>
        <option value="timeout">تايم أوت (Timeout)</option>
        <option value="mute">كتم (Mute)</option>
        <option value="unmute">فك الكتم (Unmute)</option>
        <option value="verify">توثيق ⭐</option>
        <option value="unverify">إزالة التوثيق</option>
        <option value="delserver">حذف خادم يملكه العضو</option>
      </select>
    </div>

    <div class="row"><label>المدة بالدقائق (للتايم أوت فقط)</label><input id="adMins" type="number" value="10" min="1"></div>

    <div class="row" id="adSrvRow" style="display:none">
      <label>اسم الخادم المراد حذفه</label><input id="adSrvName" placeholder="اسم الخادم">
    </div>

    <div class="modal-actions">
      <button class="mOk" onclick="applyAdminAction()">تنفيذ</button>
      <button class="mNo" onclick="closeModal()">إغلاق</button>
    </div>
  `);
  $('#adAction').addEventListener('change', e => {
    $('#adSrvRow').style.display = e.target.value === 'delserver' ? 'block' : 'none';
  });
}

function applyAdminAction(){
  const un = $('#adUser').value.trim();
  const action = $('#adAction').value;
  const mins = parseInt($('#adMins').value) || 10;
  const u = Object.values(DB.users).find(x => x.username.toLowerCase() === un.toLowerCase());
  if(!u){ toast('العضو غير موجود'); return; }
  if(u.isOwner && action !== 'verify'){ toast('لا يمكن تنفيذ ذلك على الأونر'); return; }

  switch(action){
    case 'ban':
      u.banned = true;
      logAction(ME, `حظر العضو @${u.username} من الموقع`, u);
      toast('تم الحظر ✔', true); break;
    case 'unban':
      u.banned = false;
      logAction(ME, `فك الحظر عن @${u.username}`, u);
      toast('تم فك الحظر ✔', true); break;
    case 'timeout':
      u.timeout = now() + mins * 60000;
      logAction(ME, `تايم أوت ${mins} دقيقة للعضو @${u.username}`, u);
      toast(`تم إعطاء تايم أوت ${mins} دقيقة ✔`, true); break;
    case 'mute':
      u.mute = true;
      logAction(ME, `كتم العضو @${u.username}`, u);
      toast('تم الكتم ✔', true); break;
    case 'unmute':
      u.mute = false; u.timeout = 0;
      logAction(ME, `فك الكتم عن @${u.username}`, u);
      toast('تم فك الكتم ✔', true); break;
    case 'verify':
      u.star = true;
      logAction(ME, `وثّق العضو @${u.username} ⭐`, u);
      toast('تم التوثيق ⭐', true); break;
    case 'unverify':
      u.star = false;
      logAction(ME, `أزال توثيق @${u.username}`, u);
      toast('تم إزالة التوثيق', true); break;
    case 'delserver': {
      const sn = $('#adSrvName').value.trim();
      const srv = Object.values(DB.servers).find(s => s.ownerId === u.id && s.name.toLowerCase() === sn.toLowerCase());
      if(!srv){ toast('لم يتم العثور على الخادم'); return; }
      if(srv.id === 's_main' || srv.id === 's_owner'){ toast('لا يمكن حذف خادم أساسي'); return; }
      delete DB.servers[srv.id];
      if(state.serverId === srv.id){ state.serverId = 's_main'; pickFirstChannel('s_main'); }
      logAction(ME, `حذف خادم "${srv.name}" المملوك لـ @${u.username}`, u);
      saveServers();
      toast('تم حذف الخادم ✔', true); break;
    }
  }
  DB.users[u.id] = u;
  saveUsers(); closeModal(); renderAll();
}

/* =====================================================================
   Init
   ===================================================================== */
(function init(){
  ensureBaseServers();
  watchFirebase();

  // انتظار أول تحميل من Firebase
  let waited = 0;
  const check = setInterval(() => {
    waited += 100;
    if(Object.keys(DB.users).length > 0 || waited > 4000){
      clearInterval(check);
      $('#loadingScreen').classList.add('hidden');

      // استرجاع الجلسة
      let savedId = null;
      try { savedId = localStorage.getItem('itex_session'); } catch(e){}
      const saved = savedId ? DB.users[savedId] : null;
      if(saved && !saved.banned){
        enterApp(saved);
      } else {
        $('#authScreen').classList.remove('hidden');
      }
    }
  }, 100);
})();

window.addEventListener('resize', () => {
  if(window.innerWidth > 920) closePanels();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
</script>
