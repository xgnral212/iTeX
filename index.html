<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Space • 2027</title>
<style>
/* ============ الأساسيات ============ */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', 'Tahoma', sans-serif; }

:root {
  --bg: #0a0a14;
  --bg2: #12121f;
  --card: rgba(255,255,255,0.04);
  --card-hover: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --accent: #6c5ce7;
  --accent2: #00d9ff;
  --success: #00ffa3;
  --danger: #ff4757;
  --text: #e8e8f0;
  --text-dim: #8a8a9a;
}

body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* خلفية متحركة */
body::before {
  content:'';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(108,92,231,0.15), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(0,217,255,0.12), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255,71,87,0.05), transparent 60%);
  z-index: -1;
  animation: bgMove 20s ease-in-out infinite;
}
@keyframes bgMove {
  0%,100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.1) rotate(5deg); }
}

/* ============ شاشة الدخول ============ */
#loginScreen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
}

.login-box {
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  padding: 50px 40px;
  border-radius: 24px;
  text-align: center;
  width: 100%; max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  animation: fadeUp 0.6s ease;
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(20px); }
  to { opacity:1; transform: translateY(0); }
}

.login-box .lock-icon {
  font-size: 48px;
  margin-bottom: 15px;
  display: inline-block;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.login-box h1 {
  font-size: 26px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.login-box p.sub {
  color: var(--text-dim);
  font-size: 14px;
  margin-bottom: 25px;
}

.code-input {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: 2px solid var(--border);
  background: rgba(0,0,0,0.3);
  color: var(--text);
  font-size: 22px;
  text-align: center;
  letter-spacing: 14px;
  font-weight: 600;
  transition: 0.3s;
}
.code-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(108,92,231,0.15);
}

.btn {
  padding: 14px 28px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), #8b7cf6);
  transition: 0.3s;
  width: 100%;
  margin-top: 15px;
  position: relative;
  overflow: hidden;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(108,92,231,0.4);
}
.btn:active { transform: translateY(0); }

.error-msg {
  color: var(--danger);
  margin-top: 15px;
  font-size: 14px;
  min-height: 20px;
}

/* ============ القائمة الجانبية ============ */
#mainScreen {
  display: flex;
  min-height: 100vh;
  position: relative;
}

.sidebar {
  width: 260px;
  background: rgba(18,18,31,0.8);
  backdrop-filter: blur(20px);
  border-left: 1px solid var(--border);
  padding: 25px 20px;
  display: flex;
  flex-direction: column;
  transition: 0.4s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  z-index: 100;
}
.sidebar.collapsed {
  width: 80px;
}
.sidebar.collapsed .nav-text,
.sidebar.collapsed .logo-text,
.sidebar.collapsed .user-info { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; }

.sidebar-header {
  display: flex; align-items: center; gap: 12px;
  padding-bottom: 25px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.logo-text {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, #fff, var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-list {
  list-style: none;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-item {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 16px;
  border-radius: 12px;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 15px;
  font-weight: 500;
  transition: 0.25s;
  border: 1px solid transparent;
  user-select: none;
}
.nav-item:hover {
  background: var(--card-hover);
  color: var(--text);
}
.nav-item.active {
  background: linear-gradient(135deg, rgba(108,92,231,0.2), rgba(0,217,255,0.1));
  color: #fff;
  border-color: rgba(108,92,231,0.4);
}
.nav-item .icon {
  font-size: 20px;
  flex-shrink: 0;
}

.sidebar-footer {
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.logout-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%;
  padding: 12px;
  background: rgba(255,71,87,0.1);
  color: var(--danger);
  border: 1px solid rgba(255,71,87,0.2);
  border-radius: 12px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: 0.25s;
}
.logout-btn:hover {
  background: rgba(255,71,87,0.2);
}

/* زر تصغير القائمة */
.toggle-btn {
  position: absolute;
  top: 25px;
  left: -14px;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--bg);
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  z-index: 101;
  transition: 0.3s;
}
.toggle-btn:hover { transform: scale(1.15) rotate(180deg); }

/* ============ المحتوى ============ */
.content {
  flex: 1;
  padding: 40px 45px;
  overflow-y: auto;
  max-height: 100vh;
}

.page {
  display: none;
  animation: fadeIn 0.4s ease;
}
.page.active { display: block; }

@keyframes fadeIn {
  from { opacity:0; transform: translateY(10px); }
  to { opacity:1; transform: translateY(0); }
}

.page-title {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #fff, var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.page-sub {
  color: var(--text-dim);
  font-size: 15px;
  margin-bottom: 35px;
}

/* كارت الرفع */
.upload-card {
  background: var(--card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 35px;
  text-align: center;
  transition: 0.3s;
  position: relative;
  overflow: hidden;
}
.upload-card::before {
  content:'';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(108,92,231,0.05), transparent);
  pointer-events: none;
}

.upload-area {
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 50px 20px;
  margin-bottom: 20px;
  cursor: pointer;
  transition: 0.3s;
  position: relative;
}
.upload-area:hover {
  border-color: var(--accent);
  background: rgba(108,92,231,0.05);
}
.upload-area.dragover {
  border-color: var(--accent2);
  background: rgba(0,217,255,0.08);
  transform: scale(1.01);
}

.upload-icon {
  font-size: 56px;
  margin-bottom: 15px;
  display: block;
  filter: drop-shadow(0 0 20px rgba(108,92,231,0.5));
}
.upload-area h3 {
  font-size: 18px;
  margin-bottom: 8px;
  color: var(--text);
}
.upload-area p {
  font-size: 13px;
  color: var(--text-dim);
}

input[type="file"] { display: none; }

.file-name {
  margin: 15px 0;
  padding: 12px;
  background: rgba(0,255,163,0.08);
  border: 1px solid rgba(0,255,163,0.2);
  border-radius: 10px;
  color: var(--success);
  font-size: 14px;
  display: none;
}
.file-name.show { display: block; }

.status-msg {
  margin-top: 15px;
  font-size: 14px;
  min-height: 20px;
  font-weight: 500;
}

/* شبكة الفيديوهات */
.videos-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  flex-wrap: wrap;
  gap: 15px;
}
.videos-count {
  color: var(--text-dim);
  font-size: 14px;
}
.videos-count span {
  color: var(--accent2);
  font-weight: 700;
}

.btn-danger {
  background: linear-gradient(135deg, var(--danger), #ff6b81);
  padding: 10px 20px;
  width: auto;
  margin: 0;
  font-size: 14px;
}
.btn-danger:hover { box-shadow: 0 10px 25px rgba(255,71,87,0.4); }

.videos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.video-card {
  background: var(--card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
  transition: 0.3s;
  animation: fadeIn 0.4s ease;
}
.video-card:hover {
  transform: translateY(-5px);
  border-color: rgba(108,92,231,0.4);
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

.video-card video {
  width: 100%;
  border-radius: 12px;
  display: block;
  background: #000;
}

.video-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  gap: 10px;
}
.video-date {
  font-size: 12px;
  color: var(--text-dim);
}

.del-btn {
  background: rgba(255,71,87,0.15);
  color: var(--danger);
  border: 1px solid rgba(255,71,87,0.3);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: 0.25s;
  width: auto;
  margin: 0;
}
.del-btn:hover {
  background: rgba(255,71,87,0.3);
  transform: scale(1.05);
}

/* حالة فارغة */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-state .emoji {
  font-size: 64px;
  margin-bottom: 15px;
  display: block;
  opacity: 0.5;
}

/* ============ موبايل ============ */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    top: 0; right: 0;
    height: 100vh;
    transform: translateX(100%);
    width: 260px;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar.collapsed { width: 260px; }
  .sidebar.collapsed .nav-text,
  .sidebar.collapsed .logo-text { display: block; }
  .sidebar.collapsed .nav-item { justify-content: flex-start; }

  .toggle-btn { display: none; }

  .mobile-menu-btn {
    display: flex !important;
    position: fixed;
    top: 20px; right: 20px;
    z-index: 200;
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 20px rgba(108,92,231,0.4);
  }

  .content { padding: 80px 20px 30px; }
  .page-title { font-size: 24px; }
  .upload-card { padding: 20px; }
  .upload-area { padding: 35px 15px; }

  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 99;
  }
  .overlay.show { display: block; }
}

.mobile-menu-btn { display: none; }
</style>
</head>
<body>

<!-- ============ شاشة الدخول ============ -->
<div id="loginScreen">
  <div class="login-box">
    <span class="lock-icon">🔐</span>
    <h1>مرحباً بك</h1>
    <p class="sub">أدخل الرمز السري للدخول</p>
    <input type="password" id="codeInput" class="code-input" placeholder="••••••" maxlength="6" inputmode="numeric">
    <button class="btn" onclick="checkCode()">دخول</button>
    <p id="errorMsg" class="error-msg"></p>
  </div>
</div>

<!-- ============ الموقع ============ -->
<div id="mainScreen" style="display:none;">

  <!-- زر المنيو للموبايل -->
  <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
  <div class="overlay" id="overlay" onclick="toggleMobileMenu()"></div>

  <!-- القائمة الجانبية -->
  <aside class="sidebar" id="sidebar">
    <button class="toggle-btn" onclick="toggleSidebar()">‹</button>

    <div class="sidebar-header">
      <div class="logo-icon">🚀</div>
      <div class="logo-text">My Space</div>
    </div>

    <ul class="nav-list">
      <li class="nav-item active" onclick="switchPage('upload', this)">
        <span class="icon">📤</span>
        <span class="nav-text">رفع فيديو</span>
      </li>
      <li class="nav-item" onclick="switchPage('videos', this)">
        <span class="icon">🎬</span>
        <span class="nav-text">الفيديوهات</span>
      </li>
    </ul>

    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">
        <span>🚪</span>
        <span class="nav-text">خروج</span>
      </button>
    </div>
  </aside>

  <!-- المحتوى -->
  <main class="content">

    <!-- الصفحة 1: رفع فيديو -->
    <section class="page active" id="page-upload">
      <h1 class="page-title">رفع فيديو</h1>
      <p class="page-sub">اختر فيديو من جهازك وسيُحفظ في الذاكرة المؤقتة</p>

      <div class="upload-card">
        <label for="videoInput" class="upload-area" id="uploadArea">
          <span class="upload-icon">🎥</span>
          <h3>اضغط لاختيار فيديو</h3>
          <p>أو اسحب الفيديو وأفلته هنا</p>
        </label>
        <input type="file" id="videoInput" accept="video/*">

        <div class="file-name" id="fileName"></div>
        <button class="btn" onclick="uploadVideo()">💾 حفظ الفيديو</button>
        <p class="status-msg" id="statusMsg"></p>
      </div>
    </section>

    <!-- الصفحة 2: الفيديوهات -->
    <section class="page" id="page-videos">
      <h1 class="page-title">الفيديوهات المحفوظة</h1>
      <p class="page-sub">جميع الفيديوهات المخزّنة على هذا الجهاز</p>

      <div class="videos-header">
        <p class="videos-count">عدد الفيديوهات: <span id="videoCount">0</span></p>
        <button class="btn btn-danger" onclick="clearAll()">🗑️ حذف الكل</button>
      </div>

      <div class="videos-grid" id="videoList"></div>
    </section>

  </main>
</div>

<script>
/* ===================================================
   الإعدادات
=================================================== */
const SECRET_CODE = "150051";

let db;

/* ===================================================
   قاعدة البيانات IndexedDB
=================================================== */
const request = indexedDB.open("MyVideoDB", 1);

request.onupgradeneeded = (e) => {
  db = e.target.result;
  db.createObjectStore("videos", { autoIncrement: true, keyPath: "id" });
};

request.onsuccess = (e) => {
  db = e.target.result;
  loadVideos();
};

request.onerror = () => alert("❌ فشل فتح قاعدة البيانات");

/* ===================================================
   الدخول
=================================================== */
function checkCode() {
  const input = document.getElementById("codeInput").value.trim();
  const error = document.getElementById("errorMsg");

  if (input === SECRET_CODE) {
    sessionStorage.setItem("loggedIn", "true");
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("mainScreen").style.display = "flex";
    loadVideos();
  } else {
    error.textContent = "❌ الرمز خطأ، حاول مرة أخرى";
    document.getElementById("codeInput").value = "";
    document.getElementById("codeInput").focus();
  }
}

document.getElementById("codeInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") checkCode();
});

window.addEventListener("load", () => {
  if (sessionStorage.getItem("loggedIn") === "true") {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("mainScreen").style.display = "flex";
    loadVideos();
  }
  document.getElementById("codeInput").focus();
});

function logout() {
  if (!confirm("هل تريد الخروج؟")) return;
  sessionStorage.removeItem("loggedIn");
  location.reload();
}

/* ===================================================
   التنقل بين الصفحات
=================================================== */
function switchPage(page, el) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));

  document.getElementById("page-" + page).classList.add("active");
  el.classList.add("active");

  // إغلاق القائمة في الموبايل
  if (window.innerWidth <= 768) {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  }
}

/* ===================================================
   تصغير/تكبير القائمة + الموبايل
=================================================== */
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("collapsed");
}

function toggleMobileMenu() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

/* ===================================================
   اختيار الفيديو + السحب والإفلات
=================================================== */
const fileInput = document.getElementById("videoInput");
const uploadArea = document.getElementById("uploadArea");
const fileNameEl = document.getElementById("fileName");

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (file) {
    fileNameEl.textContent = "📁 " + file.name + " • " + (file.size / 1024 / 1024).toFixed(2) + " MB";
    fileNameEl.classList.add("show");
  }
});

["dragover", "dragenter"].forEach(ev => {
  uploadArea.addEventListener(ev, (e) => {
    e.preventDefault();
    uploadArea.classList.add("dragover");
  });
});
["dragleave", "drop"].forEach(ev => {
  uploadArea.addEventListener(ev, (e) => {
    e.preventDefault();
    uploadArea.classList.remove("dragover");
  });
});
uploadArea.addEventListener("drop", (e) => {
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith("video/")) {
    fileInput.files = e.dataTransfer.files;
    fileNameEl.textContent = "📁 " + file.name + " • " + (file.size / 1024 / 1024).toFixed(2) + " MB";
    fileNameEl.classList.add("show");
  }
});

/* ===================================================
   رفع الفيديو
=================================================== */
function uploadVideo() {
  const file = fileInput.files[0];
  const status = document.getElementById("statusMsg");

  if (!file) {
    status.textContent = "⚠️ اختر فيديو أولاً";
    status.style.color = "#fbbf24";
    return;
  }

  if (!file.type.startsWith("video/")) {
    status.textContent = "⚠️ الملف ليس فيديو";
    status.style.color = "#fbbf24";
    return;
  }

  status.textContent = "⏳ جاري الحفظ...";
  status.style.color = "#60a5fa";

  const reader = new FileReader();
  reader.onload = () => {
    const tx = db.transaction("videos", "readwrite");
    const store = tx.objectStore("videos");
    store.add({
      data: reader.result,
      name: file.name,
      date: new Date().toLocaleString("ar-EG")
    });

    tx.oncomplete = () => {
      status.textContent = "✅ تم حفظ الفيديو بنجاح";
      status.style.color = "#00ffa3";
      fileInput.value = "";
      fileNameEl.classList.remove("show");
      fileNameEl.textContent = "";
      loadVideos();
      setTimeout(() => status.textContent = "", 3000);
    };

    tx.onerror = () => {
      status.textContent = "❌ فشل الحفظ (الفيديو كبير جداً؟)";
      status.style.color = "#ff4757";
    };
  };
  reader.readAsDataURL(file);
}

/* ===================================================
   عرض الفيديوهات
=================================================== */
function loadVideos() {
  if (!db) return;
  const list = document.getElementById("videoList");
  list.innerHTML = "";
  let count = 0;

  const tx = db.transaction("videos", "readonly");
  const store = tx.objectStore("videos");
  const req = store.openCursor();

  req.onsuccess = (e) => {
    const cursor = e.target.result;
    if (cursor) {
      const item = cursor.value;
      count++;

      const card = document.createElement("div");
      card.className = "video-card";
      card.innerHTML = `
        <video src="${item.data}" controls preload="metadata"></video>
        <div class="video-info">
          <span class="video-date">${item.date}</span>
          <button class="del-btn" onclick="deleteVideo(${item.id})">🗑️</button>
        </div>
      `;
      list.appendChild(card);
      cursor.continue();
    } else {
      document.getElementById("videoCount").textContent = count;
      if (count === 0) {
        list.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <span class="emoji">📭</span>
            <p>لا توجد فيديوهات محفوظة بعد</p>
          </div>
        `;
      }
    }
  };
}

/* ===================================================
   الحذف
=================================================== */
function deleteVideo(id) {
  if (!confirm("هل تريد حذف هذا الفيديو؟")) return;
  const tx = db.transaction("videos", "readwrite");
  tx.objectStore("videos").delete(id);
  tx.oncomplete = () => loadVideos();
}

function clearAll() {
  if (!confirm("⚠️ هل تريد حذف كل الفيديوهات؟ لا يمكن التراجع!")) return;
  const tx = db.transaction("videos", "readwrite");
  tx.objectStore("videos").clear();
  tx.oncomplete = () => loadVideos();
}
</script>
